<!doctype html>
<meta charset="utf-8">
<title>Swiper virtual removal — index order reproduction</title>
<style>.swiper{width:300px;height:100px;overflow:hidden}.swiper-wrapper{display:flex}.swiper-slide{flex-shrink:0;width:300px;height:100px}pre{white-space:pre-wrap}</style>
<h1>Removing virtual slides B and D</h1>
<p>Both calls should leave A, C, E, F. The descending index call leaves A, C, D, F.</p>
<button onclick="demonstrate()">Run again</button><pre id="result"></pre>
<script src="swiper-probe.bundle.js"></script>
<script>
function demonstrate(){
 const results=[[1,3],[3,1]].map(indexes=>runCase(true,indexes,true));
 // runCase owns the carousel body; keep the result visible after both calls.
 document.body.innerHTML='<h1>Swiper virtual removal</h1><pre></pre>';
 document.querySelector('pre').textContent=results.map(x=>JSON.stringify({indexes:x.indexes,expected:x.expectedData,actual:x.after.data,active:x.after.active},null,2)).join('\n');
 return results;
}
demonstrate();
</script>
